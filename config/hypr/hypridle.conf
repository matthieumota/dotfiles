# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock                                            # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                         # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && pkill -x qs # turn on screen after resume, restart qs (can wedge on lost output).
}

listener {
    timeout = 300                      # 5min.
    on-timeout = loginctl lock-session # lock screen when timeout has passed.
}

listener {
    timeout = 330                                                 # 5.5min.
    ignore_inhibit = true
    condition_cmd = pidof hyprlock
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off when timeout has passed.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on when activity is detected.
}

listener {
    timeout = 330           # 5.5min, same as above but independent of the hyprlock condition (which is often
    ignore_inhibit = true   # skipped entirely thanks to Chrome's near-constant idle inhibits, which also skips
    on-timeout = true       # the on-resume of the listener above): restart qs on resume regardless of lock
    on-resume = pkill -x qs # state, since it can wedge on lost output whenever the monitor cycles off/on.
}

listener {
    timeout = 1800                 # 30min.
    on-timeout = systemctl suspend # suspend pc.
}

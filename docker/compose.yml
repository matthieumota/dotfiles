services:
  database:
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports: [3306:3306]
    volumes:
      - db-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    ports: [1025:1025, 8025:8025]

  redis:
    image: redis
    ports: [6379:6379]

  nginx:
    image: nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./nginx/server.crt:/etc/nginx/server.crt
      - ./nginx/server.key:/etc/nginx/server.key
      - ~/Code:/home/matthieu/Code

  python313: &python
    build:
      context: ./python
      args:
        PYTHON_VERSION: 3.13
    command: sleep infinity
    ports:
      - 8313:8000
    user: matthieu
    volumes:
      - ~/Code:/home/matthieu/Code

  python312:
    <<: *python
    build:
      context: ./python
      args:
        PYTHON_VERSION: 3.12
    ports:
      - 8312:8000

  python311:
    <<: *python
    build:
      context: ./python
      args:
        PYTHON_VERSION: 3.11
    ports:
      - 8311:8000

  python310:
    <<: *python
    build:
      context: ./python
      args:
        PYTHON_VERSION: '3.10'
    ports:
      - 8310:8000

  python39:
    <<: *python
    build:
      context: ./python
      args:
        PYTHON_VERSION: 3.9
    ports:
      - 8309:8000

  python38:
    <<: *python
    build:
      context: ./python
      args:
        PYTHON_VERSION: 3.8
    ports:
      - 8308:8000

volumes:
  db-data:
